<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Real-time Earthquake Activity Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<!-- When hosting externally, change above to: https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b15;--card:#0d1420;--surface:#111a2b;--hover:#1a2540;
  --bdr:rgba(99,102,241,.1);--bdr2:rgba(99,102,241,.18);
  --tx:#d4dae6;--tx2:#6b7a94;--acc:#6366f1;--acc-bg:rgba(99,102,241,.12);
  --font:system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code',monospace;
  --green:#22c55e;--red:#ef4444;--orange:#f97316;--amber:#eab308;--cyan:#06b6d4;--blue:#3b82f6;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px}
.dash{display:flex;height:100vh}
.sb{width:52px;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0;z-index:5}
.sb .logo{width:32px;height:32px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-weight:700;font-size:11px;color:#fff;letter-spacing:-.5px}
.nb{width:36px;height:36px;border-radius:8px;border:none;background:0 0;color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.nb:hover,.nb.on{background:var(--acc-bg);color:var(--acc)}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb .sp{flex:1}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tb{padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.tb h1{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.sr-wrap{position:relative;flex:1;max-width:300px}
.sr{width:100%;height:32px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:0 10px;color:var(--tx);font:12px var(--font);outline:0}
.sr:focus{border-color:var(--acc)}
.sr-drop{position:absolute;top:36px;left:0;right:0;background:var(--card);border:1px solid var(--bdr2);border-radius:8px;z-index:20;max-height:300px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sr-item{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bdr);font-size:12px;transition:background .1s}
.sr-item:hover{background:var(--hover)}
.sr-item:last-child{border-bottom:none}
.sr-empty{padding:14px;text-align:center;color:var(--tx2);font-size:12px}
.sr-status{padding:6px 12px;font-size:10px;color:var(--tx2);border-bottom:1px solid var(--bdr);text-transform:uppercase;letter-spacing:.5px}
.tb .sp{flex:1}
.pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.pill-live{background:rgba(34,197,94,.15);color:var(--green)}
.upd{color:var(--tx2);font-size:11px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 20px;flex-shrink:0}
.cd{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px}
.cd-l{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.cd-v{font-size:24px;font-weight:700;letter-spacing:-1px;font-family:var(--mono)}
.cd-s{font-size:11px;color:var(--tx2);margin-top:3px;display:flex;align-items:center;gap:4px}
.cd-s .up{color:var(--red)}
.cd-s .dn{color:var(--green)}
#cme-banner{padding:0 20px}
#cme-banner:empty{display:none}
.cme-bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.25);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:background .15s}
.cme-bar:hover{background:rgba(249,115,22,.1)}
.cme-icon{width:34px;height:34px;border-radius:8px;background:rgba(249,115,22,.15);color:#f97316;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cme-body{flex:1;min-width:0}
.cme-title{font-size:12px;font-weight:600;color:#f97316}
.cme-meta{font-size:11px;color:var(--tx2);margin-top:1px}
.cme-eta{font-family:var(--mono);font-size:14px;font-weight:700;color:#f97316;flex-shrink:0;text-align:right}
.cme-eta-label{font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.ct{flex:1;display:flex;overflow:hidden;min-height:0}
.mw{flex:1;position:relative;overflow:hidden;min-width:0;background:#040810}
.mw svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.mw svg:active{cursor:grabbing}
.ml{position:absolute;bottom:12px;left:12px;display:flex;gap:5px;z-index:2}
.lb{padding:4px 9px;border-radius:6px;border:1px solid var(--bdr);background:rgba(7,11,21,.88);color:var(--tx2);font-size:11px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s;font-family:var(--font)}
.lb.on{background:var(--acc-bg);color:var(--acc);border-color:var(--bdr2)}
.mt{position:fixed;background:rgba(10,16,28,.96);border:1px solid rgba(99,102,241,.2);border-radius:8px;padding:8px 12px;pointer-events:none;z-index:10;font-size:12px;backdrop-filter:blur(12px);display:none;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mt .mg{font-family:var(--mono);font-weight:700;font-size:15px}
.mt .lc{color:var(--tx2);margin-top:2px;font-size:11px}
.mt .dp{color:var(--tx2);font-size:11px;margin-top:1px}
.zh{position:absolute;bottom:12px;right:12px;font-size:11px;color:var(--tx2);background:rgba(7,11,21,.8);padding:4px 10px;border-radius:6px;z-index:2;pointer-events:none}
.pn{width:310px;border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:var(--card)}
.pt{display:flex;border-bottom:1px solid var(--bdr);flex-shrink:0}
.ptb{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:500;color:var(--tx2);cursor:pointer;border:none;border-bottom:2px solid transparent;transition:.15s;background:0 0;font-family:var(--font)}
.ptb.on{color:var(--acc);border-bottom-color:var(--acc)}
.pc{flex:1;overflow-y:auto}
.ei{padding:9px 12px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s;display:flex;gap:9px;align-items:flex-start}
.ei:hover{background:var(--hover)}
.ei.sel{background:var(--acc-bg)}
.eb{min-width:38px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;flex-shrink:0}
.eif{flex:1;min-width:0}
.eif .el{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eif .em{font-size:11px;color:var(--tx2);margin-top:2px;display:flex;gap:7px}
.eif .em span{white-space:nowrap}
.dt{padding:14px}
.dt-h{margin-bottom:14px}
.dt-m{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:-2px}
.dt-l{font-size:13px;margin-top:3px}
.dt-t{font-size:12px;color:var(--tx2);margin-top:3px}
.dt-g{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
.ds{background:var(--surface);border-radius:7px;padding:9px 11px}
.ds-l{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.ds-v{font-family:var(--mono);font-weight:600;font-size:14px;margin-top:2px}
.ta{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.ta-ok{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.ta-wr{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.dt-s{margin-top:18px}
.dt-s h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:8px}
.es{padding:40px 20px;text-align:center;color:var(--tx2)}
.es p{font-size:13px;margin-top:8px}
.as{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.as-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.as-m{font-family:var(--mono);font-weight:600;width:30px}
.as-t{color:var(--tx2);flex:1;font-size:11px}
.nb-i{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.nb-i .eb{min-width:34px;height:20px;font-size:11px;border-radius:4px}
.nb-i .el{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-i .ed{font-size:11px;color:var(--tx2)}
.fl{padding:7px 12px;border-bottom:1px solid var(--bdr);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.fc{padding:3px 7px;border-radius:5px;border:1px solid var(--bdr);background:0 0;color:var(--tx2);font-size:10px;cursor:pointer;font-family:var(--font);transition:.15s}
.fc.on{background:var(--acc-bg);color:var(--acc);border-color:var(--bdr2)}
.cr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px 20px;flex-shrink:0}
.cc{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;overflow:hidden;min-width:0}
.cc-t{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:6px}
.cw{width:100%;height:clamp(90px,12vh,140px);position:relative}
.cw svg{width:100%;height:100%;overflow:visible}
.pulse-ring{fill:none;pointer-events:none}

/* Page content */
.pgc{flex:1;overflow-y:auto;padding:20px;display:none}
.pg-section{margin-bottom:24px}
.pg-section h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pg-section h2 .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}

/* Events table */
.ev-head{display:grid;grid-template-columns:60px 1fr 100px 80px 100px;gap:8px;padding:8px 14px;font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);background:var(--card);border-radius:8px 8px 0 0;cursor:pointer;user-select:none}
.ev-head span:hover{color:var(--acc)}
.ev-row{display:grid;grid-template-columns:60px 1fr 100px 80px 100px;gap:8px;padding:10px 14px;font-size:12px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s;align-items:center}
.ev-row:hover{background:var(--hover)}
.ev-row:last-child{border-bottom:none;border-radius:0 0 8px 8px}
.ev-table{background:var(--card);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}

/* Alert cards */
.alert-card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.alert-card.critical{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04)}
.alert-card.info{border-color:rgba(34,197,94,.2);background:rgba(34,197,94,.03)}
.alert-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.alert-body{flex:1}
.alert-title{font-size:13px;font-weight:600;margin-bottom:3px}
.alert-meta{font-size:11px;color:var(--tx2)}

/* Analytics grid */
.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.an-card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px}
.an-card h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:10px}
.an-cw{width:100%;height:clamp(140px,22vh,220px);position:relative}
.an-cw svg{width:100%;height:100%;overflow:visible}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-item{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px}
.stat-label{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:4px}
.stat-sub{font-size:11px;color:var(--tx2);margin-top:2px}

/* Settings */
.set-group{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:12px}
.set-group h3{font-size:12px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(99,102,241,.05)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:12px}
.set-val{font-size:12px;color:var(--tx2);background:var(--surface);padding:4px 10px;border-radius:6px;border:1px solid var(--bdr)}
.saved-loc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(99,102,241,.05)}
.saved-loc:last-child{border-bottom:none}
.loc-pin{width:28px;height:28px;border-radius:6px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.loc-info{flex:1}
.loc-name{font-size:12px;font-weight:500}
.loc-detail{font-size:11px;color:var(--tx2);margin-top:1px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:0 0}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,.2);border-radius:3px}
@media print{
  .sb,.ml,.zh,.mt{display:none!important}
  .dash{height:auto;overflow:visible}
  .mn{overflow:visible}
  .ct{flex-direction:column;overflow:visible}
  .pn{width:100%;border-left:none;border-top:1px solid #333}
}
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .ct{flex-direction:column}
  .pn{width:100%;height:280px;border-left:none;border-top:1px solid var(--bdr)}
  .cr{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="dash">
  <aside class="sb">
    <div class="logo">EQ</div>
    <button class="nb on" data-page="dashboard" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
    <button class="nb" data-page="map" title="Live Map"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-2 2.5-3 5.5-3 9s1 6.5 3 9c2-2.5 3-5.5 3-9s-1-6.5-3-9"/></svg></button>
    <button class="nb" data-page="events" title="Recent Events"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="nb" data-page="alerts" title="Alerts"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
    <button class="nb" data-page="analytics" title="Analytics"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></button>
    <button class="nb" data-page="enso" title="El Niño / La Niña"><svg viewBox="0 0 24 24"><path d="M2 12c2-3 4-4 6-4s4 2 6 2 4-2 6-4M2 17c2-3 4-4 6-4s4 2 6 2 4-2 6-4M2 7c2-3 4-4 6-4s4 2 6 2 4-2 6-4"/></svg></button>
    <button class="nb" data-page="solar" title="Solar Activity"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
    <button class="nb" data-page="schumann" title="Schumann Resonance"><svg viewBox="0 0 24 24"><path d="M2 12h2l3-9 3 18 3-12 3 6 2-3h4"/></svg></button>
    <button class="nb" data-page="risk" title="Seismic Risk Factors"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></button>
    <div class="sp"></div>
    <button class="nb" data-page="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </aside>
  <div class="mn">
    <div class="tb">
      <h1>Earthquake Activity</h1>
      <div class="sr-wrap">
        <input class="sr" id="search" placeholder="Search locations or events…" autocomplete="off" />
        <div class="sr-drop" id="sr-drop"></div>
      </div>
      <div class="sp"></div>
      <span id="moon-ind" style="display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;cursor:pointer" onclick="switchPage('risk')"></span>
      <span class="pill pill-live" id="live-pill">&#9679; Live</span>
      <span class="upd" id="upd-time">Loading…</span>
    </div>
    <div class="cards" id="cards"></div>
    <div id="cme-banner"></div>
    <div class="ct">
      <div class="mw">
        <svg id="map"></svg>
        <div class="ml" id="layers"></div>
        <span class="zh">Scroll to zoom · Drag to pan</span>
        <div class="mt" id="tip"></div>
      </div>
      <div class="pn">
        <div class="pt">
          <button class="ptb on" data-tab="recent">Recent Events</button>
          <button class="ptb" data-tab="detail">Detail</button>
        </div>
        <div class="fl" id="filters"></div>
        <div class="pc" id="panel"></div>
      </div>
    </div>
    <div class="cr" id="charts"></div>
    <div id="pgc" class="pgc"></div>
  </div>
</div>

<script>
const NOW = Date.now(), H = 36e5, D = 864e5;
let isLive = false, lastUpdate = null;

let EQ = [
  {id:'e01',mag:5.8,lat:-38.65,lng:178.35,depth:35,loc:'42 km E of Gisborne, New Zealand',region:'New Zealand',time:NOW-2*H,tsunami:false,felt:1240},
  {id:'e02',mag:4.6,lat:42.5,lng:144.8,depth:45,loc:'Offshore Hokkaido, Japan',region:'Japan',time:NOW-3.5*H,tsunami:false,felt:380},
  {id:'e03',mag:6.2,lat:-33.5,lng:-72.1,depth:28,loc:'Near coast of central Chile',region:'Chile',time:NOW-1.2*H,tsunami:true,felt:4800},
  {id:'e04',mag:3.2,lat:36.2,lng:-120.5,depth:8,loc:'Central California',region:'California',time:NOW-6*H,tsunami:false,felt:45},
  {id:'e05',mag:7.1,lat:51.8,lng:-176.2,depth:55,loc:'Aleutian Islands, Alaska',region:'Alaska',time:NOW-0.5*H,tsunami:true,felt:2100},
  {id:'e06',mag:4.1,lat:-21.2,lng:-175.5,depth:120,loc:'Tonga Islands region',region:'Tonga',time:NOW-8*H,tsunami:false,felt:90},

// ── Utilities ──
const W = 1000, Hh = 500;
function px(lng){ return ((((lng+5)%360)+360)%360)/360*W; }
function py(lat){ return (90-lat)/180*Hh; }

// Smooth curve rendering with wrap handling
function smoothPath(coords) {
  const pts = coords.map(([ln,lt])=>[px(ln),py(lt)]);
  const segs = [[]];
  for(let i=0;i<pts.length;i++){
    if(i>0 && Math.abs(pts[i][0]-pts[i-1][0])>W*0.4) segs.push([]);
    segs[segs.length-1].push(pts[i]);
  }
  const valid = segs.filter(s=>s.length>2);
  if(valid.length===1){
    return d3.line().curve(d3.curveLinearClosed)(valid[0]);
  }
  const open = d3.line().curve(d3.curveLinear);
  return valid.map(s=>open(s)+'Z').join('');
}
function smoothLine(coords) {
  const pts = coords.map(([ln,lt])=>[px(ln),py(lt)]);
  const segs = [[]];
  for(let i=0;i<pts.length;i++){
    if(i>0 && Math.abs(pts[i][0]-pts[i-1][0])>W*0.4) segs.push([]);
    segs[segs.length-1].push(pts[i]);
  }
  const curve = d3.line().curve(d3.curveLinear);
  return segs.filter(s=>s.length>1).map(s=>curve(s)).join('');
}

function magColor(m){
  if(m<2.5) return '#3b82f6';
  if(m<3.5) return '#06b6d4';
  if(m<4.5) return '#22d3ee';
  if(m<5.0) return '#eab308';
  if(m<5.5) return '#f59e0b';
  if(m<6.0) return '#f97316';
  if(m<6.5) return '#ef4444';
  if(m<7.0) return '#dc2626';
  return '#b91c1c';
}
function magBg(m){ return magColor(m)+'22'; }
function magR(m){
  if(m<3) return 3; if(m<4) return 4.5; if(m<5) return 6;
  if(m<6) return 8.5; if(m<7) return 11; return 14;
}
function relTime(t){
  const d=Date.now()-t;
  if(d<6e4) return 'just now';
  if(d<H) return Math.floor(d/6e4)+'m ago';
  if(d<D) return Math.floor(d/H)+'h ago';
  return Math.floor(d/D)+'d ago';
}
function utcStr(t){ return new Date(t).toISOString().replace('T',' ').replace(/\.\d+Z/,' UTC'); }
function depthLabel(d){ return d<70?'Shallow':d<300?'Intermediate':'Deep'; }
function energy(m){
  const j=Math.pow(10,1.5*m+4.8);
  if(j<1e12) return (j/1e9).toFixed(1)+' GJ';
  if(j<1e15) return (j/1e12).toFixed(1)+' TJ';
  return (j/1e15).toFixed(1)+' PJ';
}

// ── State ──
let selectedId = null, activeTab = 'recent', magFilter = 0;
const layers = { quakes:true, plates:false, volcanoes:false, tsunami:true };

// ── Map ──
function buildMap(){
  const svg = d3.select('#map').attr('viewBox',`0 0 ${W} ${Hh}`).attr('preserveAspectRatio','xMidYMid meet');

  // SVG Defs: gradients and filters
  const defs = svg.append('defs');

  // Ocean radial gradient
  const og = defs.append('radialGradient').attr('id','oGrad').attr('cx','50%').attr('cy','42%').attr('r','68%');
  og.append('stop').attr('offset','0%').attr('stop-color','#0b1525');
  og.append('stop').attr('offset','60%').attr('stop-color','#070e1a');
  og.append('stop').attr('offset','100%').attr('stop-color','#030710');

  // Land gradient fill
  const lg = defs.append('linearGradient').attr('id','lGrad').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1');
  lg.append('stop').attr('offset','0%').attr('stop-color','#1b2d4a');
  lg.append('stop').attr('offset','100%').attr('stop-color','#142340');

  // Marker glow
  const gf = defs.append('filter').attr('id','mkGlow').attr('x','-100%').attr('y','-100%').attr('width','300%').attr('height','300%');
  gf.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation','5').attr('result','b');
  const gm = gf.append('feMerge');
  gm.append('feMergeNode').attr('in','b');
  gm.append('feMergeNode').attr('in','SourceGraphic');

  // Land shadow
  const sf = defs.append('filter').attr('id','lShadow').attr('x','-3%').attr('y','-3%').attr('width','106%').attr('height','106%');
  sf.append('feGaussianBlur').attr('in','SourceAlpha').attr('stdDeviation','2').attr('result','sh');
  sf.append('feOffset').attr('in','sh').attr('dx','0').attr('dy','1.5').attr('result','shO');
  sf.append('feComponentTransfer').attr('in','shO').append('feFuncA').attr('type','linear').attr('slope','0.35');
  const sm = sf.append('feMerge');
  sm.append('feMergeNode');
  sm.append('feMergeNode').attr('in','SourceGraphic');

  // Ring of Fire glow
  const rf = defs.append('filter').attr('id','rofGlow').attr('x','-10%').attr('y','-10%').attr('width','120%').attr('height','120%');
  rf.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation','2.5').attr('result','rb');
  const rm = rf.append('feMerge');
  rm.append('feMergeNode').attr('in','rb');
  rm.append('feMergeNode').attr('in','SourceGraphic');

  // Vignette gradient
  const vg = defs.append('radialGradient').attr('id','vig').attr('cx','50%').attr('cy','46%').attr('r','58%');
  vg.append('stop').attr('offset','0%').attr('stop-color','transparent');
  vg.append('stop').attr('offset','85%').attr('stop-color','transparent');
  vg.append('stop').attr('offset','100%').attr('stop-color','rgba(3,5,10,0.5)');

  const g = svg.append('g');

  // Ocean with gradient
  g.append('rect').attr('width',W).attr('height',Hh).attr('fill','url(#oGrad)');

  // Subtle ocean depth bands
  const depthG = g.append('g').attr('opacity',.06);
  [[px(180),py(5),180,120,'#2563eb'],[px(-160),py(-20),100,80,'#1d4ed8'],[px(160),py(40),60,50,'#1e40af']].forEach(([cx,cy,rx,ry,c])=>{
    depthG.append('ellipse').attr('cx',cx).attr('cy',cy).attr('rx',rx).attr('ry',ry).attr('fill',c);
  });

  // Graticule
  const gratG = g.append('g');
  for(let ln=-180;ln<=180;ln+=30){
    const x=px(ln);
    gratG.append('line').attr('x1',x).attr('y1',0).attr('x2',x).attr('y2',Hh)
      .attr('stroke','rgba(80,120,220,.04)').attr('stroke-width',.4).attr('class','grat');
  }
  for(let lt=-60;lt<=80;lt+=30){
    const y=py(lt);
    gratG.append('line').attr('x1',0).attr('y1',y).attr('x2',W).attr('y2',y)
      .attr('stroke','rgba(80,120,220,.04)').attr('stroke-width',.4).attr('class','grat');
  }
  // Equator highlight
  gratG.append('line').attr('x1',0).attr('y1',py(0)).attr('x2',W).attr('y2',py(0))
    .attr('stroke','rgba(99,132,241,.08)').attr('stroke-width',.6).attr('stroke-dasharray','8 4').attr('class','grat');
  // Tropics
  [23.44,-23.44].forEach(lt=>{
    gratG.append('line').attr('x1',0).attr('y1',py(lt)).attr('x2',W).attr('y2',py(lt))
      .attr('stroke','rgba(99,132,241,.03)').attr('stroke-width',.3).attr('stroke-dasharray','3 5').attr('class','grat');
  });

  // Land masses with smooth curves
  const landG = g.append('g');
  CONTINENTS.forEach(c=>{
    landG.append('path').attr('d',smoothPath(c))
      .attr('fill','url(#lGrad)').attr('stroke','#2a4468').attr('stroke-width',.6)
      .attr('filter','url(#lShadow)').attr('class','land');
  });

  // Shelf / coastal glow on major continents
  const shelfG = g.append('g').attr('opacity',.04);
  CONTINENTS.slice(0,6).forEach(c=>{
    shelfG.append('path').attr('d',smoothPath(c))
      .attr('fill','none').attr('stroke','#4488cc').attr('stroke-width',4);
  });

  // Ocean labels
  const labStyle = {fill:'rgba(70,110,200,.07)',fontFamily:'var(--font)',fontWeight:'600',textAnchor:'middle'};
  [[px(180),py(20),'PACIFIC OCEAN',20,8],[px(-160),py(-25),'SOUTH PACIFIC',12,4],[px(70),py(12),'INDIAN OCEAN',13,5],[px(5),py(30),'ATLANTIC',11,3]].forEach(([x,y,t,sz,sp])=>{
    const txt = g.append('text').attr('x',x).attr('y',y).text(t).attr('class','olabel');
    Object.entries(labStyle).forEach(([k,v])=>txt.style(k==='textAnchor'?'text-anchor':k,v));
    txt.style('font-size',sz+'px').style('letter-spacing',sp+'px');
  });

  // Tectonic Plate Boundaries (all)
  const rofG = g.append('g').style('display','none').attr('class','rof-group');
  // Ring of Fire (orange, prominent)
  [ROF_WEST,ROF_EAST].forEach(r=>{
    rofG.append('path').attr('d',smoothLine(r))
      .attr('fill','none').attr('stroke','rgba(249,115,22,.45)').attr('stroke-width',2)
      .attr('stroke-dasharray','8 5').attr('stroke-linecap','round')
      .attr('filter','url(#rofGlow)').attr('class','rof');
  });
  // All other plate boundaries (violet, subtler)
  Object.values(PLATES).forEach(plate=>{
    rofG.append('path').attr('d',smoothLine(plate))
      .attr('fill','none').attr('stroke','rgba(168,85,247,.35)').attr('stroke-width',1.2)
      .attr('stroke-dasharray','5 4').attr('stroke-linecap','round').attr('class','rof');
  });

  // CME Geomagnetic Impact Zones
  const cmeG = g.append('g').attr('class','cme-impact');
  const predictedKp = 5; // from demo CME data
  // Aurora/impact extends further from poles at higher Kp
  // Kp5: aurora visible ~55°N/S, strong impact 60-75°
  // Band positions in SVG y-coordinates
  const zones = [
    // Northern hemisphere
    {y1:py(75),y2:py(63),fill:'rgba(249,115,22,.12)',label:'Direct Impact Zone'},
    {y1:py(63),y2:py(55),fill:'rgba(249,115,22,.07)'},
    {y1:py(55),y2:py(48),fill:'rgba(249,115,22,.03)'},
    // Southern hemisphere
    {y1:py(-63),y2:py(-75),fill:'rgba(249,115,22,.12)'},
    {y1:py(-55),y2:py(-63),fill:'rgba(249,115,22,.07)'},
    {y1:py(-48),y2:py(-55),fill:'rgba(249,115,22,.03)'}
  ];
  zones.forEach(z=>{
    cmeG.append('rect').attr('x',0).attr('y',Math.min(z.y1,z.y2)).attr('width',W)
      .attr('height',Math.abs(z.y2-z.y1)).attr('fill',z.fill);
  });
  // Dashed boundary lines at aurora edge
  [55,-55].forEach(lat=>{
    cmeG.append('line').attr('x1',0).attr('y1',py(lat)).attr('x2',W).attr('y2',py(lat))
      .attr('stroke','rgba(249,115,22,.25)').attr('stroke-width',.8)
      .attr('stroke-dasharray','6 4');
  });
  // Aurora zone labels
  cmeG.append('text').attr('x',px(180)).attr('y',py(68)).attr('text-anchor','middle')
    .attr('fill','rgba(249,115,22,.4)').attr('font-size','9').attr('font-family','var(--mono)')
    .attr('letter-spacing','2px').text('GEOMAGNETIC IMPACT ZONE — Kp '+predictedKp).attr('class','olabel');
  cmeG.append('text').attr('x',px(180)).attr('y',py(58)).attr('text-anchor','middle')
    .attr('fill','rgba(249,115,22,.25)').attr('font-size','7').attr('font-family','var(--mono)')
    .text('Aurora visible · Power grid risk · HF radio disruption').attr('class','olabel');
  cmeG.append('text').attr('x',px(180)).attr('y',py(-68)).attr('text-anchor','middle')
    .attr('fill','rgba(249,115,22,.3)').attr('font-size','8').attr('font-family','var(--mono)')
    .attr('letter-spacing','2px').text('SOUTHERN IMPACT ZONE').attr('class','olabel');

  // Volcanoes
  const volG = g.append('g').style('display','none').attr('class','vol-group');
  VOLCANOES.forEach(v=>{
    const x=px(v.lng),y=py(v.lat);
    volG.append('polygon').attr('points',`${x},${y-5} ${x-3.5},${y+2.5} ${x+3.5},${y+2.5}`)
      .attr('fill','rgba(249,115,22,.75)').attr('stroke','rgba(249,115,22,.35)').attr('stroke-width',.8)
      .attr('class','vm');
  });

  // Tsunami alert zones
  const tsunamiG = g.append('g').attr('class','tsunami-group');
  EQ.filter(e=>e.tsunami).forEach(e=>{
    const cx=px(e.lng),cy=py(e.lat);
    [32,22,14].forEach((r,i)=>{
      tsunamiG.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r)
        .attr('fill','none').attr('stroke',`rgba(239,68,68,${.12-.03*i})`)
        .attr('stroke-width',.8).attr('stroke-dasharray',i===0?'5 4':'3 3');
    });
  });

  // EQ markers
  const eqG = g.append('g');

  function renderMarkers(){
    eqG.selectAll('*').remove();
    [...EQ].sort((a,b)=>a.mag-b.mag).forEach(e=>{
      const cx=px(e.lng),cy=py(e.lat),r=magR(e.mag),col=magColor(e.mag);
      const isSel = e.id===selectedId;

      if(isSel){
        animatePulse(eqG.append('circle').attr('cx',cx).attr('cy',cy).attr('class','pulse-ring').attr('stroke',col).node(), r, 0);
        animatePulse(eqG.append('circle').attr('cx',cx).attr('cy',cy).attr('class','pulse-ring').attr('stroke',col).node(), r, 900);
      }

      // Outer glow circle
      eqG.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r*1.8)
        .attr('fill',col).attr('fill-opacity',.08).attr('pointer-events','none');

      const circle = eqG.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r)
        .attr('fill',col).attr('fill-opacity',.55).attr('stroke',col).attr('stroke-width',1.2).attr('stroke-opacity',.9)
        .attr('filter', isSel?'url(#mkGlow)':'none')
        .style('cursor','pointer').attr('class','eq-mk');

      circle.on('click',ev=>{
        ev.stopPropagation();
        selectedId=e.id; activeTab='detail';
        renderMarkers(); renderPanel(); updateTabs();
      });
      circle.on('mouseenter',ev=>{
        const tip=document.getElementById('tip');
        tip.style.display='block';
        tip.innerHTML=`<div class="mg" style="color:${col}">M ${e.mag.toFixed(1)}</div><div class="lc">${e.loc}</div><div class="dp">${depthLabel(e.depth)} · ${e.depth} km · ${relTime(e.time)}</div>`;
      });
      circle.on('mousemove',ev=>{
        const tip=document.getElementById('tip');
        tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY-10)+'px';
      });
      circle.on('mouseleave',()=>{ document.getElementById('tip').style.display='none'; });
    });
  }

  function animatePulse(node, baseR, delay){
    let start=null; const dur=2000;
    (function tick(ts){
      if(!start) start=ts+delay;
      const elapsed=ts-start;
      if(elapsed<0){ requestAnimationFrame(tick); return; }
      const t=(elapsed%dur)/dur;
      node.setAttribute('r', baseR+4+t*26);
      node.setAttribute('stroke-opacity', 0.45*(1-t));
      node.setAttribute('stroke-width', 2*(1-t)+0.2);
      if(node.parentNode) requestAnimationFrame(tick);
    })(performance.now());
  }

  renderMarkers();

  // Vignette overlay
  g.append('rect').attr('width',W).attr('height',Hh).attr('fill','url(#vig)').attr('pointer-events','none');

  svg.on('click',()=>{ selectedId=null; renderMarkers(); renderPanel(); });

  // Zoom (mouse drag, scroll wheel, touch pinch)
  const zoom = d3.zoom().scaleExtent([1,10]).translateExtent([[-100,-50],[W+100,Hh+50]])
    .on('zoom', event => {
      g.attr('transform',event.transform);
      const k=event.transform.k;
      eqG.selectAll('.eq-mk').each(function(){
        const eq=EQ.find(e=>Math.abs(px(e.lng)-+this.getAttribute('cx'))<0.5&&Math.abs(py(e.lat)-+this.getAttribute('cy'))<0.5);
        if(eq) this.setAttribute('r',magR(eq.mag)/k);
      });
      g.selectAll('.olabel').each(function(){
        const orig=+this.dataset.sz||parseFloat(this.style.fontSize);
        if(!this.dataset.sz) this.dataset.sz=orig;
        this.style.fontSize=(orig/k)+'px';
        const origSp=+this.dataset.sp||parseFloat(this.style.letterSpacing);
        if(!this.dataset.sp) this.dataset.sp=origSp;
        this.style.letterSpacing=(origSp/k)+'px';
      });
      g.selectAll('.grat').attr('stroke-width',function(){ return .4/k; });
      g.selectAll('.land').attr('stroke-width',.6/k);
      g.selectAll('.rof').attr('stroke-width',2/k);
    });

  svg.call(zoom);
  const k0=1.35, tx0=(W/2)*(1-k0), ty0=(Hh*0.44)*(1-k0);
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx0,ty0).scale(k0));

  window.toggleLayer = name => {
    layers[name]=!layers[name];
    if(name==='plates') rofG.style('display',layers.plates?null:'none');
    if(name==='volcanoes') volG.style('display',layers.volcanoes?null:'none');
    if(name==='tsunami') tsunamiG.style('display',layers.tsunami?null:'none');
    renderLayers();
  };
  window.refreshMarkers = renderMarkers;
}

function renderCMEBanner(){
  const banner = document.getElementById('cme-banner');
  // Demo CME data (would come from NASA DONKI when live)
  const cmes = [
    {type:'Halo',speed:680,detected:NOW-6*H,eta:NOW+30*H,kpPred:'5–6',source:'AR3842'},
    {type:'Partial Halo',speed:420,detected:NOW-28*H,eta:NOW+44*H,kpPred:'3–4',source:'AR3838'}
  ];
  const active = cmes.filter(c=>c.eta>Date.now());
  if(!active.length){ banner.innerHTML=''; return; }
  banner.innerHTML = active.map(c=>{
    const hoursLeft = Math.max(0,Math.round((c.eta-Date.now())/H));
    const minsLeft = Math.max(0,Math.round((c.eta-Date.now())/6e4)%60);
    const etaText = hoursLeft>0 ? `${hoursLeft}h ${minsLeft}m` : `${minsLeft}m`;
    return `<div class="cme-bar" onclick="switchPage('solar')">
      <div class="cme-icon">☀</div>
      <div class="cme-body">
        <div class="cme-title">CME Impact Alert — ${c.type} at ${c.speed} km/s from ${c.source}</div>
        <div class="cme-meta">Detected ${relTime(c.detected)} · Predicted Kp ${c.kpPred} · Potential SR perturbation · Click for details</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="cme-eta">${etaText}</div>
        <div class="cme-eta-label">ETA to Earth</div>
      </div>
    </div>`;
  }).join('');
}

function renderCards(){
  const last24=EQ.filter(e=>(Date.now()-e.time)<D);
  const strongest=EQ.reduce((a,b)=>a.mag>b.mag?a:b);
  const regions=new Set(EQ.map(e=>e.region));
  const totalEnergy=EQ.reduce((s,e)=>s+Math.pow(10,1.5*e.mag+4.8),0);
  document.getElementById('cards').innerHTML=`
    <div class="cd"><div class="cd-l">Last 24 Hours</div><div class="cd-v">${last24.length}</div><div class="cd-s"><span class="up">&#9650; ${Math.max(0,last24.length-18)}</span> vs yesterday</div></div>
    <div class="cd"><div class="cd-l">Strongest Today</div><div class="cd-v" style="color:${magColor(strongest.mag)}">M ${strongest.mag.toFixed(1)}</div><div class="cd-s">${strongest.loc.split(',')[0]}</div></div>
    <div class="cd"><div class="cd-l">Active Regions</div><div class="cd-v">${regions.size}</div><div class="cd-s">Monitored globally</div></div>
    <div class="cd"><div class="cd-l">Energy Released</div><div class="cd-v">${energy(Math.log10(totalEnergy/Math.pow(10,4.8))/1.5)}</div><div class="cd-s">Cumulative seismic</div></div>`;
}

// ── Panel content ──
function renderPanel(){
  const el=document.getElementById('panel');
  if(activeTab==='recent'){
    const filtered=EQ.filter(e=>e.mag>=magFilter).sort((a,b)=>b.time-a.time);
    if(!filtered.length){ el.innerHTML='<div class="es"><p>No earthquakes match filter</p></div>'; return; }
    el.innerHTML=filtered.map(e=>`
      <div class="ei${e.id===selectedId?' sel':''}" onclick="selectEq('${e.id}')">
        <div class="eb" style="background:${magBg(e.mag)};color:${magColor(e.mag)}">${e.mag.toFixed(1)}</div>
        <div class="eif"><div class="el">${e.loc}</div><div class="em"><span>${relTime(e.time)}</span><span>${e.depth} km</span><span>${e.region}</span></div></div>
      </div>`).join('');
  } else {
    const eq=EQ.find(e=>e.id===selectedId);
    if(!eq){ el.innerHTML='<div class="es"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><p>Select an earthquake on the map or list to view details</p></div>'; return; }
    const col=magColor(eq.mag), aftershocks=genAftershocks(eq);
    const nearby=EQ.filter(e=>e.id!==eq.id).map(e=>({...e,dist:Math.sqrt((e.lat-eq.lat)**2+(e.lng-eq.lng)**2)*111})).sort((a,b)=>a.dist-b.dist).slice(0,4);
    el.innerHTML=`<div class="dt">
      <div class="dt-h"><div class="dt-m" style="color:${col}">M ${eq.mag.toFixed(1)}</div><div class="dt-l">${eq.loc}</div><div class="dt-t">${utcStr(eq.time)}</div></div>
      <div class="dt-g">
        <div class="ds"><div class="ds-l">Depth</div><div class="ds-v">${eq.depth} km <span style="color:var(--tx2);font-size:10px">${depthLabel(eq.depth)}</span></div></div>
        <div class="ds"><div class="ds-l">Felt Reports</div><div class="ds-v">${eq.felt>0?eq.felt.toLocaleString():'None'}</div></div>
        <div class="ds"><div class="ds-l">Latitude</div><div class="ds-v">${eq.lat.toFixed(3)}°</div></div>
        <div class="ds"><div class="ds-l">Longitude</div><div class="ds-v">${eq.lng.toFixed(3)}°</div></div>

function genAftershocks(eq){
  const seed=eq.id.charCodeAt(2), count=Math.min(5,Math.max(0,Math.floor((eq.mag-4)*2)));
  const shocks=[]; let t=eq.time;
  for(let i=0;i<count;i++){
    t+=((seed*(i+1)*17)%100)/100*3*H+H*0.3;
    if(t>NOW) break;
    shocks.push({mag:Math.round(Math.max(1.5,eq.mag-1.5-i*0.4+(seed%3)*0.2)*10)/10, time:t});
  } return shocks;
}

function drawMagChart(){

// ── Moon Phase Calculator ──
function getMoonPhase(date){
  const known = new Date(2000, 0, 6, 18, 14).getTime();
  const cycle = 29.53058770576;
  const days = (date.getTime() - known) / 864e5;
  return (((days % cycle) + cycle) % cycle) / cycle;
}
function moonPhaseName(p){
  if(p<0.03||p>0.97) return {name:'New Moon',emoji:'🌑',tidal:'Maximum'};
  if(p<0.22) return {name:'Waxing Crescent',emoji:'🌒',tidal:'Decreasing'};
  if(p<0.28) return {name:'First Quarter',emoji:'🌓',tidal:'Minimum'};
  if(p<0.47) return {name:'Waxing Gibbous',emoji:'🌔',tidal:'Increasing'};
  if(p<0.53) return {name:'Full Moon',emoji:'🌕',tidal:'Maximum'};
  if(p<0.72) return {name:'Waning Gibbous',emoji:'🌖',tidal:'Decreasing'};
  if(p<0.78) return {name:'Last Quarter',emoji:'🌗',tidal:'Minimum'};
  return {name:'Waning Crescent',emoji:'🌘',tidal:'Increasing'};
}
function tidalStress(p){
  const distFromNewFull = Math.min(p, Math.abs(p-0.5), 1-p);
  return 1 - (distFromNewFull / 0.25);
}
function updateMoonIndicator(){
  const el = document.getElementById('moon-ind');
  const p = getMoonPhase(new Date());
  const m = moonPhaseName(p);
  const stress = tidalStress(p);
  const stressCol = stress>0.7?'#f97316':stress>0.4?'#eab308':'#22c55e';
  el.innerHTML = `<span style="font-size:18px">${m.emoji}</span><span>${m.name}</span><span style="font-size:10px;color:${stressCol};font-weight:600">Tidal: ${m.tidal}</span>`;
}
updateMoonIndicator();
setInterval(updateMoonIndicator, 60000);

function renderRiskPage(el){
  const now = new Date();
  const p = getMoonPhase(now);
  const m = moonPhaseName(p);
  const stress = tidalStress(p);
  const stressCol = stress>0.7?'#f97316':stress>0.4?'#eab308':'#22c55e';
  const stressLbl = stress>0.7?'Elevated':stress>0.4?'Moderate':'Low';

  const demoKp = solarData ? solarData.kp : 3;
  const kpCol = demoKp<=2?'#22c55e':demoKp<=4?'#eab308':demoKp<=6?'#f97316':'#ef4444';
  const daysStorm = 4;

  // Composite risk: weighted combination of tidal stress + geomagnetic + SR anomaly
  const geoFactor = Math.min(1, demoKp / 7);
  // SR anomaly: unexplained SR perturbation not attributable to known solar activity
  const srPerturbation = demoKp * 0.03;
  const srExpected = demoKp * 0.025; // what we'd expect from Kp alone
  const srAnomaly = Math.min(1, Math.max(0, (srPerturbation - srExpected) * 10 + 0.3)); // residual anomaly
  const srAnomalyCol = srAnomaly>0.6?'#f97316':srAnomaly>0.3?'#eab308':'#22c55e';
  const composite = (stress * 0.30 + geoFactor * 0.30 + (daysStorm < 3 ? 0.15 : 0) + srAnomaly * 0.25);
  const compCol = composite>0.6?'#f97316':composite>0.35?'#eab308':'#22c55e';

  for(let i=1;i<35;i++){

      <div class="stat-item"><div class="stat-label">Geomagnetic (Kp)</div><div class="stat-val" style="color:${kpCol}">${demoKp}</div><div class="stat-sub">${daysStorm}d since last storm</div></div>

function drawMoonChart(data){
  const w=900,h=180,p_={t:20,r:20,b:30,l:45},iw=w-p_.l-p_.r,ih=h-p_.t-p_.b;
  const svg = d3.select('#risk-moon-chart').append('svg').attr('viewBox',`0 0 ${w} ${h}`);
  const g_ = svg.append('g').attr('transform',`translate(${p_.l},${p_.t})`);
  const xS = d3.scaleLinear().domain([-15,15]).range([0,iw]);
  const yS = d3.scaleLinear().domain([0,1]).range([ih,0]);

  // Stress area
  const stressData = data.map(d=>({day:d.day,stress:tidalStress(d.phase)}));
  const defs = svg.append('defs');
  const gr = defs.append('linearGradient').attr('id','stressGrad').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',1);
  gr.append('stop').attr('offset','0%').attr('stop-color','#f97316').attr('stop-opacity',.25);
  gr.append('stop').attr('offset','100%').attr('stop-color','#f97316').attr('stop-opacity',.02);

  g_.append('path').datum(stressData).attr('d',d3.area().x(d=>xS(d.day)).y0(ih).y1(d=>yS(d.stress)).curve(d3.curveMonotoneX)).attr('fill','url(#stressGrad)');
  g_.append('path').datum(stressData).attr('d',d3.line().x(d=>xS(d.day)).y(d=>yS(d.stress)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#f97316').attr('stroke-width',1.5);

  // "Today" line
  g_.append('line').attr('x1',xS(0)).attr('y1',0).attr('x2',xS(0)).attr('y2',ih).attr('stroke','#ef4444').attr('stroke-width',1).attr('stroke-dasharray','4 3');
  g_.append('text').attr('x',xS(0)).attr('y',-6).attr('text-anchor','middle').attr('fill','#ef4444').attr('font-size','8').attr('font-weight','600').attr('font-family','var(--mono)').text('TODAY');

  // Moon emoji markers at new/full moons (only closest day to exact phase)
  let lastMoonDay = -999;
  data.forEach((d,i)=>{
    const m = moonPhaseName(d.phase);
    const isNewOrFull = d.phase<0.03||d.phase>0.97||(d.phase>0.47&&d.phase<0.53);
    if(isNewOrFull && (d.day - lastMoonDay) > 3){
      lastMoonDay = d.day;
      g_.append('text').attr('x',xS(d.day)).attr('y',yS(tidalStress(d.phase))-10).attr('text-anchor','middle').attr('font-size','14').text(m.emoji);
    }
  });

  // X axis
  [-15,-10,-5,0,5,10,15].forEach(d=>{
    g_.append('text').attr('x',xS(d)).attr('y',ih+16).attr('text-anchor','middle').attr('fill','#6b7a94').attr('font-size','8').attr('font-family','var(--mono)').text(d===0?'Today':(d>0?'+':'')+d+'d');
  });
  // Y axis
  [0,0.5,1].forEach(v=>{
    g_.append('text').attr('x',-8).attr('y',yS(v)+3).attr('text-anchor','end').attr('fill','#6b7a94').attr('font-size','8').attr('font-family','var(--mono)').text(v===0?'Low':v===0.5?'Med':'High');
    g_.append('line').attr('x1',0).attr('y1',yS(v)).attr('x2',iw).attr('y2',yS(v)).attr('stroke','rgba(99,102,241,.06)').attr('stroke-width',.5);
  });
}

    {icon:'❄',title:'Cooler SST',desc:'Cooler waters in the eastern Pacific may moderate NZ coastal temperatures.'}

      <div style="text-align:right"><span style="font-size:11px;color:var(--tx2)">Data Range</span><div style="font-family:var(--mono);font-size:13px;margin-top:2px">${oni[0].yr}–${latest.yr}</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-label">Current State</div><div class="stat-val" style="color:${stateCol};font-size:18px">${state}</div><div class="stat-sub">${latest.yr} ${latest.m}</div></div>
      <div class="stat-item"><div class="stat-label">ONI Value</div><div class="stat-val" style="color:${stateCol}">${latest.v>0?'+':''}${latest.v.toFixed(1)}°C</div><div class="stat-sub">Sea surface temp anomaly</div></div>
      <div class="stat-item"><div class="stat-label">Threshold</div><div class="stat-val">±0.5°C</div><div class="stat-sub">5 consecutive months</div></div>
      <div class="stat-item"><div class="stat-label">Data Source</div><div class="stat-val" style="font-size:14px">${ensoData?'NOAA CPC':'Demo'}</div><div class="stat-sub">Oceanic Niño Index</div></div>
    </div>
    <div class="an-grid">
      <div class="an-card" style="grid-column:1/-1">
        <h3>Oceanic Niño Index (ONI) — 3-Month Running Mean SST Anomaly (Niño 3.4 Region)</h3>
        <div class="an-cw" id="enso-chart" style="height:clamp(180px,28vh,280px)"></div>
      </div>
    </div>
    <div class="an-grid" style="margin-top:12px">
      <div class="an-card" style="grid-column:1/-1;padding:0;overflow:hidden">
        <h3 style="padding:14px 14px 0">Pacific SST Anomaly Map — Niño Monitoring Regions</h3>
        <div id="sst-map" style="height:clamp(350px,50vh,600px);position:relative;cursor:grab;background:#050910">
          <span style="position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--tx2);z-index:2;pointer-events:none">Scroll to zoom · Drag to pan</span>
        </div>
      </div>
      <div class="an-card">
        <h3>Impact for New Zealand & Pacific</h3>
        ${nzImpacts.map(imp=>`
          <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)">
            <span style="font-size:20px">${imp.icon}</span>
            <div><div style="font-size:12px;font-weight:500">${imp.title}</div><div style="font-size:11px;color:var(--tx2);margin-top:2px">${imp.desc}</div></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="pg-section" style="margin-top:16px">
      <h2>Historical ENSO Events</h2>
      <div class="ev-table">
        <div class="ev-head" style="grid-template-columns:80px 80px 90px 60px 1fr">
          <span>Period</span><span>Type</span><span>Strength</span><span>Peak ONI</span><span>Key Impacts</span>
        </div>
        ${ENSO_HISTORY.map(e=>{
          const tc = e.type==='El Niño'?'#ef4444':e.type==='La Niña'?'#3b82f6':'#22c55e';
          return `<div class="ev-row" style="grid-template-columns:80px 80px 90px 60px 1fr">
            <div style="font-family:var(--mono);font-size:12px">${e.yr}</div>
            <div style="color:${tc};font-weight:500;font-size:12px">${e.type}</div>
            <div style="font-size:11px;color:var(--tx2)">${e.strength}</div>

          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="pg-section" style="margin-top:16px">
      <h2>What is ENSO?</h2>
      <div class="alert-card info">
        <div class="alert-body" style="font-size:12px;line-height:1.6;color:var(--tx2)">
          <strong style="color:var(--tx)">El Niño–Southern Oscillation</strong> is a recurring climate pattern involving changes in sea surface temperatures across the central and eastern tropical Pacific. The cycle has three phases:<br><br>
          <strong style="color:#ef4444">El Niño</strong> — Warmer than normal waters in the eastern Pacific. For NZ: drier conditions, more southwest winds, marine heatwave risk.<br>
          <strong style="color:#3b82f6">La Niña</strong> — Cooler than normal waters in the eastern Pacific. For NZ: wetter conditions, more northeast winds, increased cyclone risk.<br>
          <strong style="color:#22c55e">Neutral</strong> — Near-average conditions. Weather driven by other climate drivers like the SAM and IOD.
        </div>
      </div>
    </div>`;

  drawENSOChart(oni);
  drawSSTMap(latest.v);
}

function drawENSOChart(oni){
  const w=900,h=260,p={t:20,r:20,b:30,l:45},iw=w-p.l-p.r,ih=h-p.t-p.b;
  const svg = d3.select('#enso-chart').append('svg').attr('viewBox',`0 0 ${w} ${h}`);
  const g_ = svg.append('g').attr('transform',`translate(${p.l},${p.t})`);
  const xS = d3.scaleLinear().domain([0,oni.length-1]).range([0,iw]);
  const maxV = Math.max(Math.abs(d3.min(oni,d=>d.v)),Math.abs(d3.max(oni,d=>d.v)),1.5);
  const yS = d3.scaleLinear().domain([-maxV,maxV]).range([ih,0]);

  g_.append('rect').attr('x',0).attr('y',0).attr('width',iw).attr('height',yS(0.5)).attr('fill','rgba(239,68,68,.04)');
  g_.append('rect').attr('x',0).attr('y',yS(-0.5)).attr('width',iw).attr('height',ih-yS(-0.5)).attr('fill','rgba(59,130,246,.04)');
  g_.append('text').attr('x',iw-4).attr('y',12).attr('text-anchor','end').attr('fill','rgba(239,68,68,.3)').attr('font-size','10').text('El Niño Zone');
  g_.append('text').attr('x',iw-4).attr('y',ih-4).attr('text-anchor','end').attr('fill','rgba(59,130,246,.3)').attr('font-size','10').text('La Niña Zone');

  g_.append('line').attr('x1',0).attr('y1',yS(0)).attr('x2',iw).attr('y2',yS(0)).attr('stroke','rgba(255,255,255,.15)').attr('stroke-width',1);
  [0.5,-0.5].forEach(v=>{g_.append('line').attr('x1',0).attr('y1',yS(v)).attr('x2',iw).attr('y2',yS(v)).attr('stroke','rgba(255,255,255,.08)').attr('stroke-dasharray','4 4').attr('stroke-width',.5);});

  const areaPos = d3.area().x((_,i)=>xS(i)).y0(yS(0)).y1(d=>d.v>0?yS(d.v):yS(0)).curve(d3.curveMonotoneX);
  const areaNeg = d3.area().x((_,i)=>xS(i)).y0(yS(0)).y1(d=>d.v<0?yS(d.v):yS(0)).curve(d3.curveMonotoneX);
  g_.append('path').datum(oni).attr('d',areaPos).attr('fill','rgba(239,68,68,.15)');
  g_.append('path').datum(oni).attr('d',areaNeg).attr('fill','rgba(59,130,246,.15)');
  g_.append('path').datum(oni).attr('d',d3.line().x((_,i)=>xS(i)).y(d=>yS(d.v)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#d4dae6').attr('stroke-width',1.5);
  oni.forEach((d,i)=>{g_.append('circle').attr('cx',xS(i)).attr('cy',yS(d.v)).attr('r',2).attr('fill',d.v>=0.5?'#ef4444':d.v<=-0.5?'#3b82f6':'#22c55e');});

  // "Now" line
  g_.append('line').attr('x1',xS(oni.length-1)).attr('y1',0).attr('x2',xS(oni.length-1)).attr('y2',ih).attr('stroke','#ef4444').attr('stroke-width',1).attr('stroke-dasharray','4 3');
  g_.append('text').attr('x',xS(oni.length-1)).attr('y',-6).attr('text-anchor','middle').attr('fill','#ef4444').attr('font-size','8').attr('font-weight','600').attr('font-family','var(--mono)').text('NOW');

  let lastYr=0; oni.forEach((d,i)=>{if(d.yr!==lastYr){lastYr=d.yr;g_.append('text').attr('x',xS(i)).attr('y',ih+18).attr('text-anchor','middle').attr('fill','#6b7a94').attr('font-size','9').attr('font-family','var(--mono)').text(d.yr);}});
  [-1.5,-1,-0.5,0,0.5,1,1.5].forEach(v=>{if(Math.abs(v)<=maxV) g_.append('text').attr('x',-8).attr('y',yS(v)+3).attr('text-anchor','end').attr('fill','#6b7a94').attr('font-size','8').attr('font-family','var(--mono)').text((v>0?'+':'')+v.toFixed(1));});
}

function drawSSTMap(oniVal){
  const container = document.getElementById('sst-map');
  const mw=W, mh=Hh;
  const svg = d3.select(container).append('svg').attr('viewBox',`0 0 ${mw} ${mh}`)
    .attr('preserveAspectRatio','xMidYMid meet')
    .style('width','100%').style('height','100%').style('display','block').style('touch-action','none').style('cursor','grab');
  const g = svg.append('g');
  g.append('rect').attr('width',mw).attr('height',mh).attr('fill','#050910');
  for(let ln=-180;ln<=180;ln+=30) g.append('line').attr('x1',px(ln)).attr('y1',0).attr('x2',px(ln)).attr('y2',mh).attr('stroke','rgba(80,120,220,.03)').attr('stroke-width',.3).attr('class','g-sst');
  for(let lt=-60;lt<=60;lt+=15) g.append('line').attr('x1',0).attr('y1',py(lt)).attr('x2',mw).attr('y2',py(lt)).attr('stroke','rgba(80,120,220,.03)').attr('stroke-width',.3).attr('class','g-sst');
  g.append('line').attr('x1',0).attr('y1',py(0)).attr('x2',mw).attr('y2',py(0)).attr('stroke','rgba(255,255,255,.08)').attr('stroke-dasharray','6 4').attr('stroke-width',.5).attr('class','g-sst');
  const isW=oniVal>=0, bC=isW?'rgba(239,68,68,':'rgba(59,130,246,', iN=Math.min(1,Math.abs(oniVal));
  [{lN:25,lS:-25,o:iN*0.15},{lN:18,lS:-18,o:iN*0.25},{lN:12,lS:-12,o:iN*0.35}].forEach(b=>{
    g.append('rect').attr('x',px(-180)).attr('y',py(b.lN)).attr('width',px(-80)-px(-180)).attr('height',py(b.lS)-py(b.lN)).attr('fill',bC+b.o+')');
    const wC=isW?'rgba(59,130,246,':'rgba(239,68,68,';
    g.append('rect').attr('x',px(120)).attr('y',py(b.lN)).attr('width',px(180)-px(120)).attr('height',py(b.lS)-py(b.lN)).attr('fill',wC+(b.o*0.5)+')');
  });
  [{n:'Niño 4',w:160,e:-150,nL:5,sL:-5,t:oniVal<=-0.5?0.3:oniVal>=0.5?iN*0.6:0.1},
   {n:'Niño 3.4',w:-170,e:-120,nL:5,sL:-5,t:iN*0.5,p:true},
   {n:'Niño 3',w:-150,e:-90,nL:5,sL:-5,t:oniVal>=0.5?iN*0.7:oniVal<=-0.5?iN*0.7:0.05},
   {n:'Niño 1+2',w:-90,e:-80,nL:0,sL:-10,t:oniVal>=0.5?iN*0.8:oniVal<=-0.5?iN*0.6:0.05}
  ].forEach(z=>{
    const x1=px(z.w),x2=px(z.e),y1=py(z.nL),y2=py(z.sL),op=z.t*0.6;
    if(x2<x1){g.append('rect').attr('x',x1).attr('y',y1).attr('width',mw-x1).attr('height',y2-y1).attr('fill',bC+op+')');g.append('rect').attr('x',0).attr('y',y1).attr('width',x2).attr('height',y2-y1).attr('fill',bC+op+')');}
    else g.append('rect').attr('x',x1).attr('y',y1).attr('width',x2-x1).attr('height',y2-y1).attr('fill',bC+op+')');
    if(z.p&&x2>x1){g.append('rect').attr('x',x1).attr('y',y1).attr('width',x2-x1).attr('height',y2-y1).attr('fill','none').attr('stroke','#eab308').attr('stroke-width',1.5).attr('stroke-dasharray','6 3');
      g.append('text').attr('x',(x1+x2)/2).attr('y',y1-6).attr('text-anchor','middle').attr('fill','#eab308').attr('font-size','9').attr('font-weight','600').attr('font-family','var(--mono)').text('NIÑO 3.4 — PRIMARY').attr('class','sl');}
    const cx=x2<x1?(x1+50):((x1+x2)/2),cy=(y1+y2)/2,tc=isW?'#ef4444':'#3b82f6';
    if(!z.p) g.append('text').attr('x',cx).attr('y',cy-3).attr('text-anchor','middle').attr('fill','rgba(255,255,255,.3)').attr('font-size','8').text(z.n).attr('class','sl');
    const tl=z.t>0.3?(isW?'Warm':'Cool'):z.t>0.1?(isW?'Slightly warm':'Slightly cool'):'Near normal';
    g.append('text').attr('x',cx).attr('y',cy+9).attr('text-anchor','middle').attr('fill',tc).attr('font-size','8').attr('font-weight','500').attr('font-family','var(--mono)').text(tl).attr('class','sl');
  });
  CONTINENTS.forEach(c=>g.append('path').attr('d',smoothPath(c)).attr('fill','#141e35').attr('stroke','#1e2d4a').attr('stroke-width',.4).attr('class','l-sst'));
  [[px(175),py(-38),'New Zealand',9],[px(135),py(-25),'Australia',9],[px(-75),py(-15),'S. America',9],[px(-115),py(40),'N. America',9],[px(140),py(35),'Japan',8],[px(120),py(-5),'Indonesia',8]].forEach(([x,y,t,s])=>g.append('text').attr('x',x).attr('y',y).attr('text-anchor','middle').attr('fill','rgba(255,255,255,.12)').attr('font-size',s).text(t).attr('class','sl'));
  g.append('text').attr('x',px(-160)).attr('y',py(30)).attr('text-anchor','middle').attr('fill','rgba(255,255,255,.06)').attr('font-size','14').attr('letter-spacing','5px').text('PACIFIC OCEAN').attr('class','sl');
  const aY=py(0)+20;
  if(oniVal<=-0.5){for(let ln=-170;ln<-90;ln+=20){const x=px(ln);g.append('polygon').attr('points',`${x-8},${aY-3} ${x-8},${aY+3} ${x-14},${aY}`).attr('fill','rgba(59,130,246,.3)');} g.append('text').attr('x',px(-140)).attr('y',aY+18).attr('text-anchor','middle').attr('fill','rgba(59,130,246,.4)').attr('font-size','8').text('Strong easterlies → cold upwelling').attr('class','sl');}
  else if(oniVal>=0.5){for(let ln=-160;ln<-100;ln+=20){const x=px(ln);g.append('line').attr('x1',x-15).attr('y1',aY).attr('x2',x).attr('y2',aY).attr('stroke','rgba(239,68,68,.2)').attr('stroke-width',1).attr('stroke-dasharray','3 3');} g.append('text').attr('x',px(-140)).attr('y',aY+18).attr('text-anchor','middle').attr('fill','rgba(239,68,68,.4)').attr('font-size','8').text('Weak trades → warm water pools east').attr('class','sl');}
  const lg=g.append('g').attr('transform',`translate(${mw-150},${mh-55})`);
  lg.append('rect').attr('width',140).attr('height',48).attr('rx',6).attr('fill','rgba(7,11,21,.85)').attr('stroke','rgba(99,102,241,.1)');
  lg.append('rect').attr('x',8).attr('y',8).attr('width',12).attr('height',8).attr('rx',2).attr('fill','rgba(239,68,68,.3)');
  lg.append('text').attr('x',24).attr('y',15).attr('fill','#6b7a94').attr('font-size','8').text('Warmer than normal').attr('class','sl');
  lg.append('rect').attr('x',8).attr('y',22).attr('width',12).attr('height',8).attr('rx',2).attr('fill','rgba(59,130,246,.3)');
  lg.append('text').attr('x',24).attr('y',29).attr('fill','#6b7a94').attr('font-size','8').text('Cooler than normal').attr('class','sl');
  lg.append('rect').attr('x',8).attr('y',36).attr('width',12).attr('height',4).attr('rx',1).attr('fill','none').attr('stroke','#eab308').attr('stroke-width',1).attr('stroke-dasharray','3 2');
  lg.append('text').attr('x',24).attr('y',42).attr('fill','#6b7a94').attr('font-size','8').text('Niño 3.4 monitoring box').attr('class','sl');
  // Zoom
  const zm=d3.zoom().scaleExtent([1,8]).translateExtent([[-100,-50],[mw+100,mh+50]]).on('zoom',ev=>{
    g.attr('transform',ev.transform);const k=ev.transform.k;
    g.selectAll('.g-sst').attr('stroke-width',.3/k);g.selectAll('.l-sst').attr('stroke-width',.4/k);
    g.selectAll('.sl').each(function(){const o=+this.dataset.fs||parseFloat(this.getAttribute('font-size'))||9;if(!this.dataset.fs)this.dataset.fs=o;this.setAttribute('font-size',o/k);});
  });
  svg.call(zm);
  const k0=1.3,tx0=(mw/2)*(1-k0),ty0=(mh*0.5)*(1-k0);
  svg.call(zm.transform,d3.zoomIdentity.translate(tx0,ty0).scale(k0));
}

function drawSRSpectrum(harmonics, perturbation, ampBoost){
  const w=900,h=220,p={t:16,r:20,b:30,l:50},iw=w-p.l-p.r,ih=h-p.t-p.b;
  const svg = d3.select('#sr-spectrum').append('svg').attr('viewBox',`0 0 ${w} ${h}`);
  const g_ = svg.append('g').attr('transform',`translate(${p.l},${p.t})`);
  const xS = d3.scaleLinear().domain([0,50]).range([0,iw]);
  const yS = d3.scaleLinear().domain([0,1.2]).range([ih,0]);

  // Background noise floor
  g_.append('line').attr('x1',0).attr('y1',yS(0.05)).attr('x2',iw).attr('y2',yS(0.05)).attr('stroke','rgba(255,255,255,.05)').attr('stroke-width',1);

  // Generate spectrum curve with peaks at harmonics
  const points = [];
  for(let f=0;f<=50;f+=0.2){
    let amp = 0.03; // noise floor
    harmonics.forEach(h=>{
      const pf = h.freq * (1 + perturbation);
      const dist = Math.abs(f - pf);
      const width = 0.8 + h.n * 0.15;
      const peak = (1.0 / h.n) * ampBoost * 0.9;
      amp += peak * Math.exp(-(dist*dist)/(2*width*width));
    });
    points.push({f,amp:Math.min(amp,1.15)});
  }

  // Gradient fill
  const defs = svg.append('defs');
  const grad = defs.append('linearGradient').attr('id','srGrad').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',1);
  grad.append('stop').attr('offset','0%').attr('stop-color','#818cf8').attr('stop-opacity',.3);
  grad.append('stop').attr('offset','100%').attr('stop-color','#818cf8').attr('stop-opacity',.02);

  g_.append('path').datum(points).attr('d',d3.area().x(d=>xS(d.f)).y0(ih).y1(d=>yS(d.amp)).curve(d3.curveMonotoneX)).attr('fill','url(#srGrad)');
  g_.append('path').datum(points).attr('d',d3.line().x(d=>xS(d.f)).y(d=>yS(d.amp)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#818cf8').attr('stroke-width',1.5);

  // Peak labels
  harmonics.forEach(h=>{
    const pf = h.freq*(1+perturbation);
    const peak = (1.0/h.n)*ampBoost*0.9;
    g_.append('line').attr('x1',xS(pf)).attr('y1',yS(Math.min(peak,1.1))-8).attr('x2',xS(pf)).attr('y2',ih).attr('stroke','rgba(129,140,248,.2)').attr('stroke-width',.5).attr('stroke-dasharray','3 3');
    g_.append('text').attr('x',xS(pf)).attr('y',yS(Math.min(peak,1.1))-12).attr('text-anchor','middle').attr('fill','#d4dae6').attr('font-size','9').attr('font-family','var(--mono)').text(pf.toFixed(1)+' Hz');
  });

  // "Right Now" indicator — two parallel red dashed lines at the predicted fundamental
  const nowFreq = harmonics[0].freq * (1 + perturbation);
  const nowX = xS(nowFreq);
  const gap = 5;
  g_.append('line').attr('x1',nowX-gap).attr('y1',0).attr('x2',nowX-gap).attr('y2',ih)
    .attr('stroke','#ef4444').attr('stroke-width',1.2).attr('stroke-dasharray','4 3').attr('stroke-opacity',.7);
  g_.append('line').attr('x1',nowX+gap).attr('y1',0).attr('x2',nowX+gap).attr('y2',ih)
    .attr('stroke','#ef4444').attr('stroke-width',1.2).attr('stroke-dasharray','4 3').attr('stroke-opacity',.7);
  // "NOW" label between the lines
  g_.append('text').attr('x',nowX).attr('y',-4).attr('text-anchor','middle').attr('fill','#ef4444').attr('font-size','8').attr('font-weight','600').attr('font-family','var(--mono)').text('NOW');

  // Axes
  [0,10,20,30,40,50].forEach(v=>{ g_.append('text').attr('x',xS(v)).attr('y',ih+18).attr('text-anchor','middle').attr('fill','#6b7a94').attr('font-size','9').attr('font-family','var(--mono)').text(v+' Hz'); });
  g_.append('text').attr('x',-ih/2).attr('y',-38).attr('text-anchor','middle').attr('fill','#6b7a94').attr('font-size','9').attr('transform','rotate(-90)').text('Relative Amplitude');
}

const FEEDS = [
  { name:'USGS', url:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson', transform: transformUSGS },
  { name:'EMSC', url:'https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minmag=2.5&limit=100&orderby=time', transform: transformEMSC },
  { name:'GeoNet', url:'https://api.geonet.org.nz/quake?MMI=-1', transform: transformGeoNet }
];

function extractRegion(place){
  if(!place) return 'Unknown';
  const regionMap = {'Alaska':'Alaska','California':'California','Hawaii':'Hawaii','Oregon':'California','Washington':'California',
    'Japan':'Japan','Russia':'Japan','New Zealand':'New Zealand','Chile':'Chile','Peru':'Chile','Indonesia':'Indonesia',
    'Philippines':'Philippines','Taiwan':'Philippines','China':'Philippines','Tonga':'Tonga','Fiji':'Tonga','Vanuatu':'PNG',
    'Papua New Guinea':'PNG','Solomon Islands':'PNG','Turkey':'Mediterranean','Greece':'Mediterranean','Italy':'Mediterranean',
    'Mexico':'California','Iceland':'Mediterranean','Iran':'Mediterranean'};
  for(const [key,val] of Object.entries(regionMap)){ if(place.includes(key)) return val; }
  const parts = place.split(',');
  return (parts[parts.length-1]||'').trim() || 'Other';
}

function transformUSGS(data){
  return (data.features||[]).filter(f=>f.properties.mag && f.geometry).map(f=>({
    id: f.id,
    mag: Math.round(f.properties.mag*10)/10,
    lat: f.geometry.coordinates[1],
    lng: f.geometry.coordinates[0],
    depth: Math.round(f.geometry.coordinates[2]||0),
    loc: f.properties.place || 'Unknown location',
    region: extractRegion(f.properties.place||''),
    time: f.properties.time,
    tsunami: f.properties.tsunami === 1,
    felt: f.properties.felt || 0
  }));
}

function transformEMSC(data){
  return (data.features||[]).filter(f=>f.properties && f.properties.mag).map((f,i)=>{
    const p=f.properties, g=f.geometry;
    const loc = p.flynn_region ? p.flynn_region.replace(/\b\w+/g, w=>w[0]+w.slice(1).toLowerCase()) : 'Unknown';
    return {
      id: p.unid || 'emsc'+i,
      mag: Math.round(p.mag*10)/10,
      lat: g ? g.coordinates[1] : (p.lat||0),
      lng: g ? g.coordinates[0] : (p.lon||0),
      depth: Math.round(g ? (g.coordinates[2]||p.depth||0) : (p.depth||0)),
      loc: loc,
      region: extractRegion(loc),
      time: new Date(p.time).getTime(),
      tsunami: false,
      felt: 0
    };
  });
}

function transformGeoNet(data){
  return (data.features||[]).filter(f=>f.properties && f.properties.magnitude).map(f=>{
    const p=f.properties, g=f.geometry;
    return {
      id: p.publicID || f.id,
      mag: Math.round(p.magnitude*10)/10,
      lat: g.coordinates[1],
      lng: g.coordinates[0],
      depth: Math.round(g.coordinates[2]||p.depth||0),
      loc: p.locality || 'New Zealand region',
      region: 'New Zealand',
      time: new Date(p.time).getTime(),
      tsunami: false,
      felt: 0
    };
  });
}

function updateStatus(msg, live){
  const pill = document.getElementById('live-pill');
  const upd = document.getElementById('upd-time');
  upd.textContent = msg;
  if(live){
    pill.innerHTML = '&#9679; Live';
    pill.className = 'pill pill-live';
  } else {
    pill.innerHTML = '&#9679; Demo';
    pill.className = 'pill';
    pill.style.background = 'rgba(234,179,8,.15)';
    pill.style.color = '#eab308';
  }
}

async function loadLiveData(){
  for(const feed of FEEDS){
    try {
      updateStatus(`Trying ${feed.name}…`, false);
      const res = await fetch(feed.url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const live = feed.transform(data);
      if(live.length > 0){
        EQ = live;
        isLive = true;
        lastUpdate = Date.now();
        updateStatus(`Live via ${feed.name}`, true);
        document.getElementById('map').innerHTML = '';
        buildMap();
        refreshAll();
        return feed.name;
      }
    } catch(e) {
      console.warn(`${feed.name} failed:`, e.message);
    }
  }
  isLive = false;
  updateStatus('Demo data (all feeds unavailable)', false);
  return null;
}

// Initial load: try live feeds, fall back to demo
loadLiveData().then(source => {
  if(!source) updateStatus('Demo data', false);
});

// Auto-refresh every 60 seconds
setInterval(async ()=>{
  await loadLiveData();
}, 60000);

// Update the "Updated X ago" text every 15s
setInterval(()=>{
  if(isLive && lastUpdate){
    const ago = Math.round((Date.now()-lastUpdate)/1000);
    if(ago<60) updateStatus('Updated just now', true);
    else updateStatus(`Updated ${Math.round(ago/60)}m ago`, true);
  }
}, 15000);
</script>
</body>
</html>
